# Run the same mission file for each participating namespace. --namespace only
# selects the robot; all nav_run participants must agree before anyone moves.
robot_namespace: robot_1
mission_id: rectangle_search_demo
agent_id: robot_1
primitive_id: area_search_001
coordinate_mode: enu  # enu or gps
center_enu:
  east: 10.0
  north: 0.0
center_gps:
  latitude: 0.0
  longitude: 0.0
  altitude: 0.0
rectangle:
  length_m: 10.0  # local rectangle X dimension, split into equal robot strips
  width_m: 10.0
  yaw_deg: 0.0    # 0: length points east; positive counter-clockwise
# GPS origin is read from the RUNNING nav2_input_bridge, never guessed from a
# second YAML. All robots must share that origin and ENU orientation.
map_frame: '{namespace}/map'
base_frame: '{namespace}/base_link'
height_reference_frame: '{namespace}/ground_height_reference'
controller_id: FollowPath
goal_checker_id: general_goal_checker
entry_goal_checker_id: area_entry_goal_checker
short_goal_checker_id: area_entry_goal_checker  # reuse navigation's 0.10 m position checker
topics:
  cloud: livox/lidar
  follow_path: follow_path
options:
  fill_enclosed_unknown: true  # unknown holes fully enclosed by obstacles become inferred obstacles
  fill_boundary_enclosed_unknown: true  # include pockets enclosed jointly by obstacles and ROI edges
  outside_margin_m: 2.0  # observed transit band outside the ROI; targets/coverage stay inside
  outside_cost_weight: 2.0  # soft penalty: prefer inside routes when both are usable
  refine_path: true  # weighted initial path -> collision-checked shortcuts -> 2D spline refinement
  path_spline_iterations: 2
  path_shortcut_max_segment_m: 1.5
  resolution_m: 0.1
  robot_radius_m: 0.1
  sensor_range_m: 5.0
  use_imu_ground_tilt: true  # body roll/pitch from IMU-fused TF define local terrain normal
  ground_z_m: 0.0  # ground-plane Z in base_link; negative if base is above ground
  min_obstacle_height_m: 0.05  # measured local ground plane rejects terrain returns
  max_obstacle_height_m: 0.35  # robot 0.30 m + 0.05 m clearance
  free_space_height_m: 0.30
  min_frontier_cells: 3
  min_goal_distance_m: 0.8  # preferred minimum; allow short progress if no farther goal is usable
  min_progress_distance_m: 0.2  # short-step floor; keep above short checker tolerance
  viewpoint_distance_m: 1.2
  planning_period_s: 0.5  # reassess viewpoints during motion, without waiting for arrival
  path_refresh_distance_m: 1.0  # extend clipped local segment before its endpoint
  frontier_switch_score_ratio: 1.3  # switch only for >=30% higher viewpoint score
  frontier_switch_distance_m: 1.0  # suppress small target shifts
  revisit_cost_weight: 1.5
  heading_cost_weight: 1.5
  map_update_period_s: 0.2  # point-cloud fusion and RViz map publication cadence
  max_cloud_points: 1200  # ray-integration budget; column minima use all valid hits
  local_path_length_m: 4.0
  goal_timeout_s: 90.0
  heartbeat_timeout_s: 4.0
  team_stable_s: 3.0
  team_timeout_s: 60.0
  sensor_timeout_s: 3.0
  completion_observed_ratio: 1.0
  no_frontier_confirmations: 16  # retain an observation window with the faster planning cycle
  max_path_failures: 5
  frontier_cooldown_s: 30.0
