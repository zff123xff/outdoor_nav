# 当前原生 co-search 搜索配置：激光点云输入，本地搜索与规划。
# 地图 XY 边界、机器人数量、资源路径等由 configuration.py 按任务生成，不在此重复配置。
# 旧相机内参、深度图处理和无引用的状态机参数已移除；相机内参由 yolo_detector/config/yolo.yaml 管理。
search_controller: co_search
search_strategy: parallel_lines  # co_search or parallel_lines
robot_namespace: robot_1
agent_id: robot_1
mission_id: co_search_rectangle_demo
primitive_id: area_search_001
coordinate_mode: enu
center_enu:
  east: 10.0
  north: 0.0
rectangle:
  length_m: 10.0
  width_m: 10.0
  yaw_deg: 0.0
map_frame: '{namespace}/map'
base_frame: '{namespace}/base_link'
odom_frame: '{namespace}/odom'  # Used only when incoming odometry header.frame_id is empty
controller_id: FollowPath
goal_checker_id: area_entry_goal_checker
topics:
  cloud: livox/lidar
  follow_path: follow_path
options:
  sensor_timeout_s: 3.0
co_search:
  parallel_lines:
    lane_spacing_m: 10.0
    boundary_margin_m: 0.8
    waypoint_tolerance_m: 0.5
  coverage_threshold: 0.99  # observed task cells / all task cells; 0 disables early completion
  timeout_coefficient_s_per_m2: 1.0  # active search seconds > coefficient * area, plus coverage threshold
  entry:
    inset_m: 0.8  # inset rectangle edges; must exceed clearance_m
    sample_spacing_m: 0.5
    clearance_m: 0.7  # circular endpoint/segment clearance against native occupied columns
    max_plan_attempts: 4  # per planning cycle
    retry_cooldown_s: 5.0
    timeout_s: 30.0  # continuous time without a valid entry plan
    max_execution_failures: 4  # stop after this many aborted entry FollowPath goals
  cloud_filter:
    enable_x_filter: false  # false retains points in every direction before voxel filtering
    min_x_m: 3.0  # original pointcloud frame, not radial distance
    max_x_m: 40.0
    voxel_size_m: 0.2
    accumulation_window_s: 1.0  # rolling window of timestamp-transformed clouds
    min_accumulated_points: 1  # distinct downsampled points across that window
    max_future_offset_s: 0.5  # maximum allowed lead over ROS time
    tf_lookup_timeout_s: 2.0  # wait for TF at the cloud timestamp; does not use a stale transform
  plan_period_s: 5.0
  map_period_s: 0.2
  path_spacing_m: 0.1
  startup_timeout_s: 60.0
  parameters:
    simulation: true
    sdf_map/resolution: 0.2
    sdf_map/map_size_z: 2.0
    sdf_map/obstacles_inflation: 0.199
    sdf_map/local_bound_inflate: 0.5
    sdf_map/local_map_margin: 50
    # Point-cloud obstacle height is filtered in base_link; use a zero ground reference.
    sdf_map/ground_height: 0.31
    sdf_map/min_obstacle_height: 0.8
    sdf_map/max_obstacle_height: 3.0
    sdf_map/default_dist: 0.5
    sdf_map/p_hit: 0.8
    sdf_map/p_miss: 0.1
    sdf_map/p_min: 0.12
    sdf_map/p_max: 0.99
    sdf_map/p_occ: 0.8
    sdf_map/max_ray_length: 8.0
    sdf_map/virtual_ceil_height: -10.0
    sdf_map/optimistic: true
    sdf_map/signed_dist: false
    sdf_map/box_min_z: 0.01
    sdf_map/box_max_z: 0.8
    sdf_map/no_drone_1: false
    map_ros/esdf_slice_height: 0.3
    map_ros/visualization_truncate_height: 1.0
