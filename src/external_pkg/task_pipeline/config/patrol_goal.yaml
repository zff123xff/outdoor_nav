# 巡线任务文件；coordinate_frame 选择下面 gps / enu 中的一组端点坐标。
coordinate_frame: gps # 可选: gps | enu

robot_namespace: robot_1
wait_timeout_s: 10.0

task:
  mission_id: patrol_demo
  agent_id: robot_1
  primitive_id: patrol_001
  capability_id: patrol_line
  params:
    waypoints:
      - gps:
          lat: 40.9445353
          lon: 113.172819
          alt: 1298.7345711102703
        enu:
          x: 0.0
          y: 0.0
          z: 0.0
      - gps:
          lat: 40.9446353
          lon: 113.172819
          alt: 1298.7345711102703
        enu:
          x: 0.0
          y: 11.1
          z: 0.0
    max_laps: 1                  # 自动选择近端，近端→另一端→近端为 1 趟；0 为无限往返
    hold_time_at_endpoint_s: 0.0 # 到达位置容差后立即切换；大于 0 时按指定秒数停留
