lifecycle_startup_watchdog:
  ros__parameters:
    startup_timeout: 180.0  # shared with lifecycle activation waiting for odometry/TF

# 雷达相对 base_link 的安装外参：xyz 单位米；rpy 为绕 X/Y/Z 的滚转、俯仰、偏航，单位弧度。
lidar_mount:
  ros__parameters:
    xyz: [0.18, 0.0, 0.53]
    rpy: [0.0, 0.3141592653589793, 0.0]

# 相机相对机身的安装外参，由 robot_launch 发布到 /tf_static；真机/仿真入口共用。
# 相机水平朝前；开启后发布下方安装位置与光学坐标轴转换。
# 仿真端、URDF 或其他节点已发布同一相机 TF 时，请保持 false，避免重复发布。
camera_mount:
  ros__parameters:
    enabled: true
    parent_frame: base_link                 # 父坐标系；自动加机器人命名空间
    child_frame: front_camera_optical_frame # 相机光学坐标系；须与图像 header.frame_id 一致
    # 相机光心在父坐标系中的位置，单位米：[前方 X、左方 Y、上方 Z]。
    # [0,0,0] 是待替换的占位值，不代表真实安装位置。
    xyz: [0.4, 0.0, 0.18]
    # 相机光学坐标系相对父坐标系的旋转：[roll,pitch,yaw]，单位弧度。
    # TF 旋转约定 R = Rz(yaw)*Ry(pitch)*Rx(roll)。光学坐标：X 右、Y 下、Z 前。
    # 下列旋转仅表示相机水平朝前；已包含机身坐标轴到光学坐标轴的变换。
    # 有实际俯仰/侧转时需填写对应光学外参，不能再重复叠加一次光学轴变换。
    rpy: [-1.5707963267948966, 0.0, -1.5707963267948966]

base_to_livox_tf:
  ros__parameters:

base_to_odom_tf:
  ros__parameters:

controller_server:
  ros__parameters:
    odom_topic: odom  # RELATIVE: resolves to /{robot_namespace}/odom (RELIABLE, bridged from /mavros/odom by mavros_odom_relay)
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 5.0
    progress_checker_plugin: "progress_checker"
    current_goal_checker: "general_goal_checker"
    goal_checker_plugins: ["general_goal_checker", "area_entry_goal_checker", "target_goal_checker"]
    controller_plugins: ["FollowPath", "FollowTarget"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1
      required_movement_angle: 0.2  # radians; endpoint turns also count as progress
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.50
    area_entry_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.10
      stateful: True
    target_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.15
      stateful: True
    FollowPath: &path_controller
      w_traversal_cost: 5.0  # Theta*: larger values favour lower-cost clearance corridors
      w_euc_cost: 1.0  # Theta*: larger values favour shorter paths
      enable_path_hysteresis: true
      switch_only_on_obstacle: false
      # Weighted metres; scale changes with w_euc_cost and w_traversal_cost.
      switch_penalty: 500.0
      min_switch_interval: 2.0  # steady-clock seconds; invalid retained paths bypass this
      log_path_switch: true  # throttled final-selection diagnostics
      prefer_supplied_path: true  # retain collision-free optimized task paths; Theta* repairs blocked paths
      local_path_smoothing_iterations: 2  # smooth Theta* repairs locally; 0 disables, max 5
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      lookahead_dist: 1.5  # avoid excessive curvature/speed suppression from a 0.1 m lookahead
      max_robot_pose_search_dist: 3.0  # limit nearest-path search to nearby route segments
      min_lookahead_dist: 1.0
      max_lookahead_dist: 2.0
      use_rotate_to_heading: true
      use_rotate_to_goal_heading: false  # all configured checkers require position only
      tracking_angular_vel_limit: 0.3  # preserve curvature within the drive's yaw-rate limit
      inflation_cost_scaling_factor: 1.0  # match local_costmap inflation_layer.cost_scaling_factor
      use_backup_recovery: true
      backup_recovery_trigger_cost: 200.0  # raw costmap 0..255; not every inflated cell
      backup_recovery_distance: 0.5       # maximum reverse search distance, m
      backup_recovery_speed: 0.1          # reverse speed, m/s
      stateful: true  # Retain heading-mode latch for callers using a pose goal checker.
      rotate_to_heading_angular_vel: 0.4
      rotation_accel_gain: 2.0
      rotation_damping_gain: 2.5
      rotate_to_heading_min_angle: 0.7853981633974483  # enter above 45 degrees
      rotate_to_heading_hysteresis: 0.2617993877991494  # exit at/below 30 degrees
      rotate_to_heading_direction_lock_angle: 0.17453292519943295  # +/-pi band: 10 degrees
      desired_linear_vel: 1.5
      max_allowed_time_to_collision_up_to_carrot: 1.5
      min_linear_vel: 0.1
      max_linear_vel: 1.5
      max_angular_vel: 1.2
      min_angular_vel: 0.0
      acc_lim_linear: 1.0
      acc_lim_angular: 0.2
      regulate_linear_vel: true
      allow_backward: false
    FollowTarget:
      <<: *path_controller
      use_rotate_to_goal_heading: true

controller_server_rclcpp_node:
  ros__parameters:

straight_planner:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    path_step_m: 0.1
    max_path_length_m: 10000.0  # 拒絕超過此長度的直線路徑，避免錯誤 GPS 原點生成巨量路徑點
    planning_period_s: 0.5
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
    # Relative name so the action resolves to /{robot_namespace}/follow_path
    # (matches the controller_server action name set in nav2.py).
    follow_path_action: follow_path

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      # RViz costmap plane follows ground below base_link; visualization only.
      visualization_ground_reference_frame: base_link
      # Nominal ground height in base_link, matching the obstacle height reference.
      visualization_ground_offset_z: -0.3165
      # Allow up to 1s of TF staleness while PX4 EKF2 warms up; the static
      # `map -> odom` publisher comes up immediately but PX4's
      # `odom -> base_link` only starts broadcasting after EKF2 initialization
      # following the first heartbeat + sensor data.
      transform_tolerance: 1.0
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      footprint: "[ [0.40, 0.27], [0.40, -0.27], [-0.40, -0.27], [-0.40, 0.27] ]"
      footprint_padding: 0.2
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        clear_before_update: true
        min_points_per_cell: 5  # valid returns per XY cell within point_count_window_s
        point_count_window_s: 3.0  # seconds; 0 counts each cloud independently
        observation_sources: pointcloud
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0
        pointcloud:
          topic: /livox/lidar
          obstacle_max_range: 40.0  # maximum obstacle marking distance, m
          raytrace_max_range: 40.0  # maximum clearing ray distance, m
          # Fixed body-relative height filter; no fitted ground-reference TF.
          height_reference_frame: base_link
          height_reference_ground_z: -0.31  # nominal ground Z in base_link
          # A vertical column is occupied if any non-ground return is in this band.
          min_obstacle_height: 0.8
          max_obstacle_height: 3.0
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: "PointCloud2"
          observation_persistence: 3.0  # seconds; expire old pointcloud observations
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0  # slower decay keeps meaningful costs farther from obstacles
        inflation_radius: 2.0  # metres; ROS double parameter requires a decimal point
      always_send_full_costmap: true
  local_costmap_client:
    ros__parameters:
  local_costmap_rclcpp_node:
    ros__parameters:

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 10.0
    node_names: ['controller_server', 'straight_planner']

nav2_input_bridge:
  ros__parameters:
    local_odom_topic: "mavros/odom"  # ROS 2 mavros publishes ~/odom; ROS 1 used local_position/odom
    # Fallback odometry topic: used only while local_odom_topic has never
    # delivered a message (e.g. a simulator publishing straight to /{ns}/odom).
    local_odom_fallback_topic: "odom"
    # Odometry watchdog: how long a gap in the odom stream is tolerated
    # before the node reports that the odom->base_link TF is gone.
    odom_timeout_s: 2.0
    odom_watchdog_period_s: 1.0

