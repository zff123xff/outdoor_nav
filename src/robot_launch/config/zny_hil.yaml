# 启动配置：仿真和导航读取；命令行 robot_namespace:=... 优先。
launch_config:
  ros__parameters:
    robot_namespace: robot_1

# Beijing ZNY: navigation owns TF; system time by default.
# Change GPS reference to match the simulator before submitting goals.
base_to_livox_tf:
  ros__parameters:
    use_sim_time: false
base_to_odom_tf:
  ros__parameters:
    use_sim_time: false
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 5.0
    progress_checker_plugin: progress_checker
    current_goal_checker: general_goal_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.2
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      desired_linear_vel: 1.0
      max_allowed_time_to_collision_up_to_carrot: 1.5
      min_linear_vel: 0.1
      max_linear_vel: 1.3
      max_angular_vel: 1.0
      min_angular_vel: 0.0
      acc_lim_linear: 1.0
      acc_lim_angular: 1.5
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.15
      regulate_linear_vel: true
      allow_backward: false
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false
straight_planner:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    path_step_m: 0.1
    goal_xy_tolerance: 0.2
    planning_period_s: 0.5
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
    follow_path_action: follow_path
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 1.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      footprint: '[ [0.40, 0.27], [0.40, -0.27], [-0.40, -0.27], [-0.40, 0.27] ]'
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        clear_before_update: true
        observation_sources: pointcloud
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0
        pointcloud:
          topic: /livox/lidar
          obstacle_range: 9.0
          raytrace_range: 9.0
          min_obstacle_height: 0.05
          max_obstacle_height: 1.0
          clearing: true
          marking: true
          inf_is_valid: true
          data_type: PointCloud2
          observation_keep_time: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 8.0
        inflation_radius: 0.8
      always_send_full_costmap: true
  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 10.0
    node_names:
    - controller_server
    - straight_planner
nav2_input_bridge:
  ros__parameters:
    use_sim_time: false
    local_odom_topic: mavros/odom
    # Fallback odometry topic: used only while local_odom_topic has never
    # delivered a message (e.g. a simulator publishing straight to /{ns}/odom).
    local_odom_fallback_topic: odom
    # Odometry watchdog: how long a gap in the odom stream is tolerated
    # before the node reports that the odom->base_link TF is gone.
    odom_timeout_s: 2.0
    odom_watchdog_period_s: 1.0
    reference_latitude: 40.9445353
    reference_longitude: 113.172819
    reference_altitude: 1298.7345711102703
    goal_input_topic: gp_goal
    uav_goal_input_topic: uav/target_gps
    target_detected_topic: target_detected
    goal_output_topic: goal_pose
    goal_output_frame: map
    require_nav_sat_fix: false
    goal_yaw_from_bearing: false
